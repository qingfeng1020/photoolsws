name: Build NikonGPS IPA (iOS 15 / TrollStore)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (15.x for iOS 15 support)
        run: |
          ls /Applications/ | grep -i xcode || true
          XCODE_15=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | head -n1)
          if [ -n "$XCODE_15" ]; then
            echo "Using $XCODE_15"
            sudo xcode-select -s "$XCODE_15"
          else
            echo "Xcode 15 not found, using default"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: photools/apps/ios/PhotoolsMobile
        run: xcodegen generate

      - name: Build (Release, unsigned, iOS 15.0)
        working-directory: photools/apps/ios/PhotoolsMobile
        run: |
          xcodebuild \
            -project PhotoolsMobile.xcodeproj \
            -scheme PhotoolsMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET="15.0" \
            clean build

      - name: Locate .app and package into .ipa
        working-directory: photools/apps/ios/PhotoolsMobile
        run: |
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry NikonGPS-iOS15.0.ipa Payload
          echo "IPA created at dist/NikonGPS-iOS15.0.ipa"
          ls -lh NikonGPS-iOS15.0.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonGPS-iOS15.0-ipa
          path: photools/apps/ios/PhotoolsMobile/dist/NikonGPS-iOS15.0.ipa
          retention-days: 30
